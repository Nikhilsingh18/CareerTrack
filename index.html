<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerTrack - Job Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header class="header">
        <div class="header-content">
            <h1>CareerTrack</h1>
            <p>Find your next opportunity</p>
        </div>
    </header>

    <main class="container">

        <section class="search-section">
            <h2>Find Jobs</h2>

            <div class="search-controls">
                <input type="text" id="searchInput" placeholder="Search job, company, location or skills...">

                <select id="jobTypeFilter">
                    <option value="All">All Job Types</option>
                    <option value="Internship">Internship</option>
                    <option value="Full-time">Full-time</option>
                </select>
            </div>

            <p id="totalJobs"></p>
            <p id="jobCount"></p>
        </section>

        <div class="content-layout">

            <section class="jobs-section">
                <h2>Available Jobs</h2>
                <div id="jobList" class="job-list"></div>
            </section>

            <aside class="saved-section">
                <h2>⭐ My Saved Jobs</h2>
                <p id="savedCount">Saved jobs: 0</p>
                <div id="savedJobsList"></div>
            </aside>

        </div>

    </main>

    <footer class="footer">
        <p>CareerTrack &copy; 2026 Built by Nikhil Singh</p>
    </footer>

</body>

</html>
